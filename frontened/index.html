<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication | Login & Register</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <div class="auth-container">
    <!-- Header Tabs -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="loginTab">Log In</button>
      <button class="tab-btn" id="registerTab">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active">
      <h2>Welcome Back</h2>
      <p class="subtitle">Please enter your credentials to access your account.</p>

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="loginEmail" placeholder="name@example.com" required />
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
          <i class="fa-solid fa-eye toggle-password"></i>
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Log In</button>

      <div class="divider"><span>OR</span></div>

      <div class="social-auth">
        <button type="button" class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
        <button type="button" class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
      </div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form">
      <h2>Create Account</h2>
      <p class="subtitle">Get started with your free account today.</p>

      <div class="input-group">
        <label for="regName">Full Name</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="regName" placeholder="John Doe" required />
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="input-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="regEmail" placeholder="name@example.com" required />
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="input-group">
        <label for="regPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="regPassword" placeholder="At least 8 characters" required />
          <i class="fa-solid fa-eye toggle-password"></i>
        </div>
        <small class="error-msg"></small>
      </div>

      <div class="input-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-shield-halved input-icon"></i>
          <input type="password" id="regConfirmPassword" placeholder="Repeat password" required />
          <i class="fa-solid fa-eye toggle-password"></i>
        </div>
        <small class="error-msg"></small>
      </div>

      <button type="submit" class="submit-btn">Sign Up</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
